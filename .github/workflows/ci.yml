name: Provider CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.14.0
          terraform_wrapper: false
      - name: Unit and regression tests
        run: go test ./... -count=1
      - name: Build production provider
        run: go build -o "$RUNNER_TEMP/terraform-provider-cloudns" .
      - name: Build isolated CLI test provider
        run: |
          mkdir -p "$RUNNER_TEMP/cloudns-cli"
          go build -o "$RUNNER_TEMP/cloudns-cli/terraform-provider-cloudns" ./tests/cli-provider
      - name: Terraform CLI import and TTL plan/apply/plan (simulated API)
        run: python3 tests/geodns_ttl_cli.py
        env:
          CLOUDNS_TF_DEV_PROVIDER_DIR: ${{ runner.temp }}/cloudns-cli
